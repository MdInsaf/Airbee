services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airbee
      POSTGRES_USER: airbee
      POSTGRES_PASSWORD: airbee-local-only
    ports:
      - "5432:5432"
    volumes:
      - airbee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbee -d airbee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./aws/backend
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    environment:
      LOCAL_DEV: "true"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: airbee
      DB_USER: airbee
      DB_PASSWORD: airbee-local-only
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: "60"
      DJANGO_SECRET_KEY: airbee-local-development-only
      LOG_LEVEL: INFO
      BEDROCK_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python /database/migrate.py && python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./aws/backend:/app
      - ./aws/database:/database:ro

volumes:
  airbee_postgres_data:
